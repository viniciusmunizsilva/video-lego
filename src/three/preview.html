<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LEGO CENA EM CENA — Brick Preview</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10131d; }
    body { display: grid; place-items: center; }
    canvas { width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); display: block; }
    .label { position: fixed; left: 20px; bottom: 18px; color: #e8e2d9; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div class="label">CENA EM CENA · Procedural brick study</div>
  <script type="module">
    import * as THREE from "three";
    import { createBrick, BRICK_PALETTE } from "./createBrick.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#10131d");
    const camera = new THREE.PerspectiveCamera(34, 9 / 16, 0.1, 100);
    camera.position.set(6.8, 6.4, 9.8);
    camera.lookAt(0, 1.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(720, 1280, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight("#fff0d6", "#172d50", 2.0));
    const key = new THREE.DirectionalLight("#ffd08a", 4.2);
    key.position.set(4, 8, 5); key.castShadow = true; scene.add(key);
    const rim = new THREE.DirectionalLight("#4c91ff", 2.6);
    rim.position.set(-5, 4, -4); scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: "#111722", roughness: .34, metalness: .12 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    floor.receiveShadow = true;
    scene.add(floor);

    const hero = createBrick({ color: BRICK_PALETTE.red, studsX: 2, studsZ: 4 });
    hero.position.set(-1.1, 0, 0);
    hero.rotation.y = -0.22;
    scene.add(hero);

    const yellow = createBrick({ color: BRICK_PALETTE.yellow, studsX: 2, studsZ: 2 });
    yellow.scale.setScalar(.72);
    yellow.position.set(1.55, .02, -1.15);
    yellow.rotation.y = .48;
    scene.add(yellow);

    const blue = createBrick({ color: BRICK_PALETTE.blue, studsX: 1, studsZ: 3 });
    blue.scale.setScalar(.62);
    blue.position.set(1.85, .02, 1.45);
    blue.rotation.y = -.55;
    scene.add(blue);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.012;
      hero.rotation.y = -0.22 + Math.sin(t * .45) * .08;
      hero.position.y = Math.sin(t) * .08;
      yellow.rotation.y = .48 + Math.sin(t * .6) * .12;
      blue.rotation.y = -.55 - Math.sin(t * .5) * .12;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
