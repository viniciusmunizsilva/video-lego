<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CENA EM CENA — Abertura 01</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12}
body{display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}
#stage{height:100dvh;aspect-ratio:9/16;max-width:100vw;position:relative;overflow:hidden;background:#080b12}
canvas{display:block;width:100%;height:100%}
#topline{position:absolute;top:18px;left:20px;color:#e8e2d9;font-size:10px;letter-spacing:.2em;opacity:.62}
#bottomline{position:absolute;bottom:18px;left:20px;color:#e8e2d9;font-size:9px;letter-spacing:.16em;opacity:.5}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#controls{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;align-items:center;color:#ddd;font:12px system-ui}
#controls button{background:#202938;border:1px solid #526078;color:#fff;padding:8px 12px;border-radius:8px;cursor:pointer}
#controls span{opacity:.7}
@media(max-aspect-ratio:9/16){#stage{width:100vw;height:auto}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
</script>
</head>
<body>
<main id="stage">
<div id="topline">CENA EM CENA · ABERTURA</div>
<div id="bottomline">LEGO · UMA EXPERIÊNCIA CINEMATOGRÁFICA</div>
<div id="flash"></div>
</main>
<div id="controls"><button id="play">Pausar</button><span>SPACE · play/pause</span></div>
<script type="module">
import * as THREE from "three";
import { createBrick, BRICK_PALETTE } from "../three/createBrick.js";

const stage=document.querySelector("#stage");
const flash=document.querySelector("#flash");
const params=new URLSearchParams(location.search);
const frameParam=params.has("frame")?Math.max(0,Math.min(119,Number(params.get("frame")))):null;
const duration=4;
let paused=frameParam!==null;
let elapsed=frameParam===null?0:frameParam/30;
let last=performance.now();

const scene=new THREE.Scene();
scene.background=new THREE.Color("#080b12");
scene.fog=new THREE.FogExp2("#080b12",.028);
const camera=new THREE.PerspectiveCamera(35,9/16,.1,100);
camera.position.set(0,4.8,16);
camera.lookAt(0,2.1,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
stage.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight("#a8bce0","#17101a",1.15));
const key=new THREE.SpotLight("#ffb34f",210,42,Math.PI/5,.55,1.2);
key.position.set(-5,11,6);key.target.position.set(0,2,0);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);
const rim=new THREE.SpotLight("#3979d8",175,38,Math.PI/4,.65,1);
rim.position.set(6,8,-5);rim.target.position.set(0,2,0);scene.add(rim,rim.target);
const fill=new THREE.PointLight("#e9782b",26,18,2);fill.position.set(2,2,4);scene.add(fill);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshPhysicalMaterial({color:"#101827",roughness:.2,metalness:.38,clearcoat:.85}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(24,14),new THREE.MeshStandardMaterial({color:"#101522",roughness:.92}));
wall.position.set(0,6,-9);scene.add(wall);

// Sparse out-of-focus practical lights in the back of the miniature studio.
for(let i=0;i<7;i++){
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.12,16,12),new THREE.MeshBasicMaterial({color:i%2?"#ffb14d":"#477ed0"}));
 bulb.position.set(-6+i*2,5+(i%3)*1.3,-7.8);scene.add(bulb);
}

const projector=new THREE.Group();projector.position.set(0,1.75,-.6);projector.rotation.y=-.12;scene.add(projector);
const shell=new THREE.MeshPhysicalMaterial({color:"#11151c",roughness:.25,metalness:.24,clearcoat:.92});
const trim=new THREE.MeshStandardMaterial({color:"#39414d",roughness:.3,metalness:.7});
const lensMat=new THREE.MeshPhysicalMaterial({color:"#ffbd58",emissive:"#ff8618",emissiveIntensity:2.4,roughness:.16,clearcoat:1});
const body=new THREE.Mesh(new THREE.BoxGeometry(3.4,1.55,1.8),shell);body.position.y=.88;body.castShadow=true;body.receiveShadow=true;projector.add(body);
const topPlate=new THREE.Mesh(new THREE.BoxGeometry(3.05,.18,1.55),trim);topPlate.position.set(0,1.72,0);projector.add(topPlate);
function reel(x){
 const g=new THREE.Group();
 const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.79,.79,.18,48),trim);wheel.rotation.z=Math.PI/2;g.add(wheel);
 const center=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.21,32),lensMat);center.rotation.z=Math.PI/2;g.add(center);
 for(let j=0;j<8;j++){const a=j*Math.PI/4;const spoke=new THREE.Mesh(new THREE.BoxGeometry(.07,.1,1.12),shell);spoke.position.set(0,Math.cos(a)*.25,Math.sin(a)*.25);spoke.rotation.x=a;g.add(spoke);}
 g.position.set(x,2.02,-.02);projector.add(g);return g;
}
const reel1=reel(-.98),reel2=reel(.98);
const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.4,.54,1.08,40),trim);barrel.rotation.x=Math.PI/2;barrel.position.set(0,.9,1.22);projector.add(barrel);
const lens=new THREE.Mesh(new THREE.CircleGeometry(.31,48),lensMat);lens.position.set(0,.9,1.77);projector.add(lens);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.39,.065,12,48),shell);ring.position.set(0,.9,1.76);projector.add(ring);

// Warm projection beam, softened by fog and transparent layered cones.
const beamMat=new THREE.MeshBasicMaterial({color:"#ffc06b",transparent:true,opacity:.075,depthWrite:false,side:THREE.DoubleSide});
const beam=new THREE.Mesh(new THREE.ConeGeometry(3.1,9.5,48,1,true),beamMat);
beam.rotation.x=-Math.PI/2;beam.position.set(0,2,-4.1);projector.add(beam);

// A stylized clapperboard assembled from separate meshes. The hinged top is animated.
const clap=new THREE.Group();clap.position.set(4.3,.85,2.3);clap.rotation.set(-.05,-.16,-.08);clap.scale.setScalar(.9);scene.add(clap);
const boardMat=new THREE.MeshPhysicalMaterial({color:"#101216",roughness:.3,metalness:.12,clearcoat:.8});
const whiteMat=new THREE.MeshStandardMaterial({color:"#eee9df",roughness:.42});
const redMat=new THREE.MeshStandardMaterial({color:"#d92325",roughness:.3});
const board=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.75,.18),boardMat);board.position.y=.9;board.castShadow=true;clap.add(board);
const inset=new THREE.Mesh(new THREE.BoxGeometry(2.36,1.15,.035),redMat);inset.position.set(0,.88,.11);clap.add(inset);
// Hinged clapper bar, pivoted at its rear edge.
const hinge=new THREE.Group();hinge.position.set(0,1.82,.02);clap.add(hinge);
const bar=new THREE.Mesh(new THREE.BoxGeometry(2.92,.42,.2),boardMat);bar.position.set(0,.21,0);bar.castShadow=true;hinge.add(bar);
for(let i=0;i<6;i++){
 const stripe=new THREE.Mesh(new THREE.BoxGeometry(.36,.44,.025),whiteMat);
 stripe.position.set(-1.2+i*.48,.21,.112);stripe.rotation.z=-.42;hinge.add(stripe);
}
const pinMat=new THREE.MeshStandardMaterial({color:"#b9c0c9",metalness:.85,roughness:.2});
for(const x of [-1.18,1.18]){const pin=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.05,20),pinMat);pin.rotation.x=Math.PI/2;pin.position.set(x,1.82,.14);clap.add(pin);}

// A miniature fantasy castle silhouette is revealed at the end of the opening,
// acting as a visual bridge into the first cinematic universe.
const castle=new THREE.Group();castle.position.set(0,0,-7.7);castle.scale.setScalar(.001);scene.add(castle);
const stone=new THREE.MeshStandardMaterial({color:"#26344c",roughness:.72});
function tower(x,z,h,r){
 const base=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,8),stone);base.position.set(x,h/2,z);base.castShadow=true;castle.add(base);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(r*1.18,h*.32,8),new THREE.MeshStandardMaterial({color:"#17243a",roughness:.7}));roof.position.set(x,h+h*.16,z);castle.add(roof);
}
const keep=new THREE.Mesh(new THREE.BoxGeometry(4.2,3.5,1.8),stone);keep.position.set(0,1.75,0);castle.add(keep);
tower(-1.55,-.1,5.1,.55);tower(1.55,-.1,4.5,.5);tower(-.8,-.7,4.1,.43);tower(.85,-.7,4.8,.46);
const moon=new THREE.Mesh(new THREE.SphereGeometry(.8,32,24),new THREE.MeshBasicMaterial({color:"#dce8ff"}));moon.position.set(3.4,6,-.3);castle.add(moon);

// Bricks are arranged in depth layers; positions are deterministic for reproducible renders.
const brickSpecs=[
 [-3.6,.34,2.8,BRICK_PALETTE.blue,2,2,.82,.2],
 [3.35,.34,1.9,BRICK_PALETTE.yellow,2,3,.78,-.35],
 [-2.8,4.0,-1.8,BRICK_PALETTE.red,2,2,.6,.3],
 [2.7,4.5,-3.0,BRICK_PALETTE.blue,2,2,.58,-.3],
 [-4.0,6.2,-5.0,BRICK_PALETTE.yellow,2,3,.56,.45],
 [4.0,6.7,-4.7,BRICK_PALETTE.red,2,2,.56,-.4]
];
const floaters=[];
for(let i=0;i<brickSpecs.length;i++){
 const s=brickSpecs[i],b=createBrick({color:s[3],studsX:s[4],studsZ:s[5]});
 b.position.set(s[0],s[1],s[2]);b.rotation.set(.12,0,s[7]);b.scale.setScalar(s[6]);scene.add(b);
 floaters.push({mesh:b,x:s[0],y:s[1],phase:i*.83,speed:.8+i*.09});
}
const foreground=[];
for(let i=0;i<5;i++){
 const b=createBrick({color:[BRICK_PALETTE.red,BRICK_PALETTE.yellow,BRICK_PALETTE.blue][i%3],studsX:2,studsZ:2});
 b.position.set(-4.5+i*2.2,.22,4.6);b.rotation.y=i*.17;b.scale.setScalar(.8);scene.add(b);foreground.push(b);
}

const ease=t=>t<0?0:t>1?1:t*t*(3-2*t);
function renderAt(t){
 const p=Math.max(0,Math.min(1,t/duration));
 // Camera push-in, then slight settle on the transition.
 camera.position.set(-.22+.42*p,4.8-.28*p,16-1.2*p);
 camera.lookAt(.08*p,2.05,0);
 projector.rotation.y=-.12+Math.sin(t*1.1)*.018;
 reel1.rotation.x=t*1.05;reel2.rotation.x=-t*.82;
 const beamPulse=.82+.18*Math.sin(t*7.2);
 beam.scale.set(beamPulse,1,beamPulse);
 floaters.forEach(o=>{
  o.mesh.position.y=o.y+Math.sin(t*o.speed+o.phase)*.13;
  o.mesh.rotation.y=Math.sin(t*.52+o.phase)*.16;
 });
 foreground.forEach((b,i)=>{b.rotation.y=i*.17+Math.sin(t*.7+i)*.025;});
 // Clapperboard enters from frame-right between 1.9s and 2.75s.
 const enter=ease((t-1.82)/.78);
 clap.position.set(4.3-3.65*enter,.85+.18*enter,2.3);
 clap.rotation.set(-.05,-.16-.08*enter,-.08-.03*enter);
 // Hinge rises then snaps shut at 3.25s.
 const open=ease((t-2.58)/.3);
 const hit=ease((t-3.12)/.12);
 hinge.rotation.z=-.02-.72*open+.72*hit;
 // Brief light hit, then transition to the first fantasy world at the final frame.
 const flashAmt=Math.max(0,1-Math.abs(t-3.78)/.11)*.88;
 flash.style.opacity=String(flashAmt);
 const reveal=ease((t-3.58)/.38);
 castle.scale.setScalar(.001+reveal*.78);
 castle.position.y=-.15+reveal*.15;
 renderer.render(scene,camera);
}
function loop(now){
 if(!paused){const dt=Math.min(.05,(now-last)/1000);elapsed=(elapsed+dt)%duration;}
 last=now;renderAt(elapsed);requestAnimationFrame(loop);
}
if(frameParam!==null){renderAt(elapsed);document.querySelector("#controls").style.display="none";}
else requestAnimationFrame(loop);
function toggle(){paused=!paused;document.querySelector("#play").textContent=paused?"Reproduzir":"Pausar";last=performance.now();}
document.querySelector("#play").addEventListener("click",toggle);
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();toggle();}});
addEventListener("resize",()=>{const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);renderAt(elapsed);});
</script>
</body>
</html>
